<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="City Drive - Multiplayer freeroam driving game">
  <meta name="theme-color" content="#1a1a2e">
  <title>City Drive - Multiplayer Freeroam</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      touch-action: none;
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 18px;
      text-align: center;
      z-index: 100;
      background: rgba(26, 26, 46, 0.9);
      padding: 20px 30px;
      border-radius: 12px;
      border: 1px solid #333;
      max-width: 90vw;
    }

    #loading::after {
      content: '';
      display: inline-block;
      animation: dots 1.5s infinite;
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }

    /* UI Overlay */
    .ui-overlay {
      position: fixed;
      z-index: 50;
      pointer-events: none;
    }

    .ui-top-left {
      top: 16px;
      left: 16px;
    }

    .ui-top-right {
      top: 16px;
      right: 16px;
    }

    .ui-bottom-left {
      bottom: 16px;
      left: 16px;
    }

    .ui-btn {
      pointer-events: auto;
      background: rgba(26, 26, 46, 0.85);
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s;
      touch-action: manipulation;
    }

    .ui-btn:hover, .ui-btn:active {
      background: rgba(50, 50, 80, 0.95);
      border-color: #666;
      transform: scale(1.02);
    }

    .ui-btn:active {
      transform: scale(0.98);
    }

    /* Config Panel */
    #config-panel {
      position: fixed;
      top: 60px;
      right: 16px;
      z-index: 100;
      background: rgba(26, 26, 46, 0.95);
      border: 1px solid #444;
      border-radius: 12px;
      padding: 20px;
      min-width: 300px;
      max-width: 90vw;
      display: none;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    #config-panel h3 {
      margin: 0 0 16px;
      color: #fff;
      font-size: 16px;
    }

    .config-field {
      margin-bottom: 12px;
    }

    .config-field label {
      display: block;
      color: #aaa;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .config-field input {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
      font-family: monospace;
    }

    .config-field input:focus {
      outline: none;
      border-color: #3498db;
    }

    .config-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .config-actions button {
      flex: 1;
    }

    .config-hint {
      font-size: 11px;
      color: #888;
      margin-top: 12px;
      line-height: 1.5;
    }

    /* Install PWA prompt */
    #install-prompt {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: linear-gradient(135deg, #3498db, #2980b9);
      color: white;
      border: none;
      border-radius: 24px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(52, 152, 219, 0.4);
      display: none;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* Connection status */
    #connection-status {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(0,0,0,0.7);
      color: #2ecc71;
      display: none;
    }

    #connection-status.offline {
      color: #e74c3c;
    }

    /* Player list */
    #player-list {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 30;
      background: rgba(26, 26, 46, 0.85);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px 12px;
      min-width: 120px;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    #player-list .player-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      font-size: 12px;
      color: #ddd;
    }

    #player-list .player-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #player-list .player-dot.local {
      background: #fff;
      box-shadow: 0 0 6px #fff;
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      #config-panel {
        top: auto;
        bottom: 16px;
        right: 16px;
        left: 16px;
        min-width: auto;
      }

      .ui-btn {
        padding: 12px 20px;
        font-size: 16px;
      }

      #loading {
        font-size: 16px;
        padding: 16px 24px;
      }
    }

    /* Landscape mobile */
    @media (max-height: 500px) and (orientation: landscape) {
      #loading {
        font-size: 14px;
        padding: 12px 20px;
      }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <div id="loading">Loading game</div>

    <!-- Connection Status -->
    <div id="connection-status" class="offline">Offline Mode</div>

    <!-- Top Left: Share Button -->
    <div class="ui-overlay ui-top-left">
      <button class="ui-btn" id="share-btn" title="Copy link to share with friends">Share Link</button>
    </div>

    <!-- Top Right: Config Button + Player List -->
    <div class="ui-overlay ui-top-right">
      <button class="ui-btn" id="config-btn" title="Firebase Config">⚙ Config</button>
      <div id="player-list"></div>
    </div>

    <!-- Config Panel -->
    <div id="config-panel">
      <h3>Firebase Configuration</h3>
      <p style="color:#aaa; font-size:12px; margin-bottom:16px;">
        Get your config from <a href="https://console.firebase.google.com" target="_blank" style="color:#3498db">Firebase Console</a> → Project Settings → Web App
      </p>
      <form id="config-form">
        <div class="config-field">
          <label>apiKey</label>
          <input type="text" id="fb-apiKey" placeholder="AIzaSy..." required>
        </div>
        <div class="config-field">
          <label>authDomain</label>
          <input type="text" id="fb-authDomain" placeholder="my-project.firebaseapp.com" required>
        </div>
        <div class="config-field">
          <label>databaseURL</label>
          <input type="text" id="fb-databaseURL" placeholder="https://my-project-default-rtdb.firebaseio.com" required>
        </div>
        <div class="config-field">
          <label>projectId</label>
          <input type="text" id="fb-projectId" placeholder="my-project" required>
        </div>
        <div class="config-field">
          <label>storageBucket</label>
          <input type="text" id="fb-storageBucket" placeholder="my-project.appspot.com" required>
        </div>
        <div class="config-field">
          <label>messagingSenderId</label>
          <input type="text" id="fb-messagingSenderId" placeholder="123456789" required>
        </div>
        <div class="config-field">
          <label>appId</label>
          <input type="text" id="fb-appId" placeholder="1:123:web:abc123" required>
        </div>
        <div class="config-actions">
          <button type="submit" class="ui-btn">Connect & Reload</button>
          <button type="button" class="ui-btn" onclick="document.getElementById('config-panel').style.display='none'">Cancel</button>
        </div>
      </form>
      <p class="config-hint">
        This creates a URL with your config. Share that URL with friends to play together!
        Your config is only stored in the URL, not on any server.
      </p>
    </div>

    <!-- Install PWA Prompt -->
    <button id="install-prompt">Install App</button>
  </div>

  <script type="module" src="/src/main.js"></script>

  <script>
    // PWA Install prompt
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-prompt').style.display = 'block';
    });

    document.getElementById('install-prompt').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          console.log('PWA installed');
        }
        deferredPrompt = null;
        document.getElementById('install-prompt').style.display = 'none';
      }
    });

    // Hide install prompt on iOS (not supported)
    if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
      document.getElementById('install-prompt').style.display = 'none';
    }

    // Register Service Worker for offline support
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
